<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aria</title>
<style>
:root{
  --bg:#0a1418; --panel:#102229; --line:#1d3a44; --ink:#e4f1f0; --dim:#7fa3a6;
  --glow:#35d6c4; --think:#f2b84b; --speak:#7aa8ff; --err:#ff7a6b;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 28%,#12303a 0%,var(--bg) 62%);color:var(--ink);
  font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
h1{font:600 22px/1 Georgia,"Times New Roman",serif;letter-spacing:.35em;color:var(--glow)}
#status{color:var(--dim);font-size:14px;min-height:21px;text-align:center}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--dim)}
.ghost:hover,.ghost:focus-visible{color:var(--ink);border-color:var(--glow)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

#stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
#orb{width:150px;height:150px;border-radius:50%;border:0;position:relative;
  background:radial-gradient(circle at 35% 30%,#aef5ec,var(--glow) 40%,#0f6d68 100%);
  box-shadow:0 0 40px 6px rgba(53,214,196,.35);transition:transform .2s,box-shadow .3s,background .3s}
#orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--glow);opacity:.35}
#orb[data-s=idle]{animation:breathe 5s ease-in-out infinite;filter:saturate(.5) brightness(.75)}
#orb[data-s=listening]{animation:pulse 1.1s ease-in-out infinite}
#orb[data-s=thinking]{background:radial-gradient(circle at 35% 30%,#ffe9b5,var(--think) 40%,#8a5c0f 100%);
  box-shadow:0 0 44px 8px rgba(242,184,75,.4);animation:spin 1.4s linear infinite}
#orb[data-s=thinking]::after{border-color:var(--think);border-style:dashed}
#orb[data-s=speaking]{background:radial-gradient(circle at 35% 30%,#d4e3ff,var(--speak) 40%,#27408a 100%);
  box-shadow:0 0 50px 10px rgba(122,168,255,.45);animation:talk .55s ease-in-out infinite}
#orb[data-s=speaking]::after{border-color:var(--speak)}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 70px 16px rgba(53,214,196,.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{0%,100%{transform:scale(1)}30%{transform:scale(1.09)}60%{transform:scale(.97)}}
@media(prefers-reduced-motion:reduce){#orb{animation:none!important}}

#log{flex:1;width:100%;max-width:760px;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:#16414a;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.s{align-self:center;color:var(--dim);font-size:13px;background:none}
.m.e{align-self:center;color:var(--err);font-size:14px}
.m a{color:var(--speak)}

footer{width:100%;max-width:760px;padding:10px 20px 18px;display:flex;gap:8px}
#txt{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
#txt::placeholder{color:var(--dim)}
.btn{background:var(--glow);color:#04211f;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.off{background:var(--panel);color:var(--ink);border:1px solid var(--line)}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font:600 18px Georgia,serif;margin-bottom:14px}
label{display:block;margin:12px 0 4px;color:var(--dim);font-size:14px}
dialog input[type=password],dialog input[type=text],dialog select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.row label{margin:0;color:var(--ink)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
small{color:var(--dim);display:block;margin-top:6px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>ARIA</h1>
  <button class="ghost" id="setBtn">Einstellungen</button>
</header>

<div id="stage">
  <button id="orb" data-s="idle" aria-label="Aria zuhören lassen"></button>
  <div id="status" role="status" aria-live="polite">Tippe auf die Kugel und sprich.</div>
</div>

<div id="log" aria-live="polite"></div>

<footer>
  <input id="txt" placeholder="Oder schreib Aria etwas …" autocomplete="off">
  <button class="btn" id="send">Senden</button>
  <button class="btn off" id="mic" aria-pressed="false">Dauerhören: aus</button>
</footer>

<dialog id="dlg">
  <h2>Einstellungen</h2>
  <label for="key">Gemini API-Key</label>
  <input type="password" id="key" autocomplete="off">
  <small>Wird nur in diesem Browser (localStorage) gespeichert.</small>
  <label for="voice">Stimme</label>
  <select id="voice"></select>
  <div class="row"><input type="checkbox" id="wake" checked><label for="wake">Nur auf „Aria“ reagieren (Dauerhören)</label></div>
  <div class="row"><input type="checkbox" id="speakOn" checked><label for="speakOn">Antworten vorlesen</label></div>
  <div class="acts">
    <button class="ghost" id="clearBtn">Verlauf löschen</button>
    <button class="btn" id="saveBtn">Speichern</button>
  </div>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const MODEL = "gemini-2.5-flash";
const URL_API = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let cfg = { key: store.get("aria_key",""), voice: store.get("aria_voice",""), wake: store.get("aria_wake",true), speak: store.get("aria_speak",true) };
let history = [], busy = false, always = false, awakeUntil = 0, speaking = false;

const SYS = `Du bist Aria, ein persönlicher Sprachassistent im Stil von Jarvis: loyal, ruhig, trocken-witzig, sehr kompetent. Sprich Deutsch und duze den Nutzer. Deine Antworten werden vorgelesen: antworte kurz (meist 1-3 Sätze), ohne Markdown, Listen, Sternchen oder Emojis. Wenn der Nutzer etwas erledigt haben will (Webseite öffnen, suchen, Video, Karte, Timer, Notiz, Wetter, Uhrzeit, Farbe ändern), rufe das passende Tool auf, statt nur darüber zu reden. Bestätige danach knapp, was du getan hast. Frage nur nach, wenn wirklich Infos fehlen.`;

const TOOLS = [{ functionDeclarations: [
  { name:"open_url", description:"Öffnet eine Webseite in einem neuen Tab.", parameters:{type:"OBJECT",properties:{url:{type:"STRING",description:"Vollständige URL"}},required:["url"]} },
  { name:"web_search", description:"Googelt etwas in einem neuen Tab.", parameters:{type:"OBJECT",properties:{query:{type:"STRING"}},required:["query"]} },
  { name:"youtube", description:"Sucht auf YouTube und öffnet die Ergebnisse.", parameters:{type:"OBJECT",properties:{query:{type:"STRING"}},required:["query"]} },
  { name:"maps", description:"Zeigt einen Ort oder eine Route in Google Maps.", parameters:{type:"OBJECT",properties:{query:{type:"STRING"}},required:["query"]} },
  { name:"get_datetime", description:"Gibt aktuelles Datum und Uhrzeit zurück." },
  { name:"weather", description:"Aktuelles Wetter und Vorhersage für eine Stadt.", parameters:{type:"OBJECT",properties:{city:{type:"STRING"}},required:["city"]} },
  { name:"set_timer", description:"Stellt einen Timer. Aria meldet sich, wenn er abläuft.", parameters:{type:"OBJECT",properties:{seconds:{type:"NUMBER"},label:{type:"STRING"}},required:["seconds"]} },
  { name:"save_note", description:"Speichert eine Notiz dauerhaft.", parameters:{type:"OBJECT",properties:{text:{type:"STRING"}},required:["text"]} },
  { name:"list_notes", description:"Liest alle gespeicherten Notizen vor." },
  { name:"set_color", description:"Ändert die Akzentfarbe der Oberfläche.", parameters:{type:"OBJECT",properties:{color:{type:"STRING",description:"CSS-Farbe oder Hex, z.B. #ff5577"}},required:["color"]} }
]}];

/* ---------- UI ---------- */
function setState(s, text){ $("#orb").dataset.s = s; if(text !== undefined) $("#status").textContent = text; }
function add(cls, text){
  const d = document.createElement("div"); d.className = "m " + cls;
  if(cls === "s" && /^https?:/.test(text)){ const a = document.createElement("a"); a.href = text; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; d.append("Popup blockiert – hier klicken: ", a); }
  else d.textContent = text;
  const l = $("#log"); l.append(d); l.scrollTop = l.scrollHeight; return d;
}
function go(url){ const w = window.open(url, "_blank", "noopener"); if(!w){ add("s", url); return false; } return true; }

/* ---------- Tools ---------- */
const timers = [];
async function runTool(name, a){
  try{
    switch(name){
      case "open_url": { let u = a.url; if(!/^https?:\/\//.test(u)) u = "https://" + u; return go(u) ? "geöffnet" : "Popup blockiert, Link im Chat angezeigt"; }
      case "web_search": return go("https://www.google.com/search?q=" + encodeURIComponent(a.query)) ? "Suche geöffnet" : "Popup blockiert, Link im Chat";
      case "youtube": return go("https://www.youtube.com/results?search_query=" + encodeURIComponent(a.query)) ? "YouTube geöffnet" : "Popup blockiert, Link im Chat";
      case "maps": return go("https://www.google.com/maps/search/" + encodeURIComponent(a.query)) ? "Karte geöffnet" : "Popup blockiert, Link im Chat";
      case "get_datetime": return new Date().toLocaleString("de-DE", { dateStyle:"full", timeStyle:"medium" });
      case "weather": {
        const g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name=" + encodeURIComponent(a.city))).json();
        if(!g.results) return "Ort nicht gefunden";
        const p = g.results[0];
        const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,apparent_temperature,precipitation,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`)).json();
        return { ort: p.name, jetzt: w.current, vorhersage_3_tage: w.daily, hinweis: "weather_code ist ein WMO-Code" };
      }
      case "set_timer": {
        const s = Math.max(1, Math.round(a.seconds)), label = a.label || "Timer";
        timers.push(setTimeout(() => { beep(); say(`${label} ist abgelaufen.`); add("a", `⏰ ${label} ist abgelaufen.`); }, s * 1000));
        return `Timer für ${s} Sekunden läuft`;
      }
      case "save_note": { const n = store.get("aria_notes", []); n.push({ t: new Date().toLocaleString("de-DE"), text: a.text }); store.set("aria_notes", n); return "Notiz gespeichert"; }
      case "list_notes": { const n = store.get("aria_notes", []); return n.length ? n : "Keine Notizen vorhanden"; }
      case "set_color": { document.documentElement.style.setProperty("--glow", a.color); return "Farbe geändert"; }
    }
    return "Unbekanntes Tool";
  }catch(e){ return "Fehler: " + e.message; }
}
function beep(){
  try{ const c = new AudioContext(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.setValueAtTime(.2, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + 1); o.start(); o.stop(c.currentTime + 1); }catch(e){}
}

/* ---------- Gemini ---------- */
async function ask(text){
  history.push({ role:"user", parts:[{ text }] });
  while(history.length > 40){ history.shift(); while(history.length && !(history[0].role === "user" && history[0].parts[0].text)) history.shift(); }
  for(let i = 0; i < 6; i++){
    const r = await fetch(URL_API, { method:"POST",
      headers:{ "Content-Type":"application/json", "x-goog-api-key": cfg.key },
      body: JSON.stringify({ systemInstruction:{ parts:[{ text: SYS }] }, contents: history, tools: TOOLS }) });
    if(!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || ("HTTP " + r.status)); }
    const d = await r.json();
    const c = d.candidates?.[0]?.content;
    if(!c || !c.parts) throw new Error("Leere Antwort von Gemini (evtl. blockiert).");
    history.push(c);
    const calls = c.parts.filter(p => p.functionCall);
    if(!calls.length) return c.parts.map(p => p.text || "").join("").trim();
    const resp = [];
    for(const p of calls){
      add("s", "⚙ " + p.functionCall.name + " " + JSON.stringify(p.functionCall.args || {}));
      const out = await runTool(p.functionCall.name, p.functionCall.args || {});
      resp.push({ functionResponse:{ name: p.functionCall.name, response:{ result: out } } });
    }
    history.push({ role:"user", parts: resp });
  }
  return "Das hat zu viele Schritte gebraucht.";
}

async function handle(text){
  text = text.trim(); if(!text || busy) return;
  if(!cfg.key){ $("#dlg").showModal(); return; }
  busy = true; stopRec(); speechSynthesis.cancel();
  add("u", text); setState("thinking", "Aria denkt …");
  try{
    const ans = await ask(text);
    add("a", ans || "…");
    awakeUntil = Date.now() + 9000;
    await say(ans);
  }catch(e){ add("e", "Fehler: " + e.message); }
  busy = false; setState("idle", always ? "Ich höre zu …" : "Tippe auf die Kugel und sprich.");
  if(always) startRec();
}

/* ---------- Sprache aus ---------- */
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("de"));
  const sel = $("#voice"); sel.innerHTML = "";
  voices.forEach(v => { const o = document.createElement("option"); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.append(o); });
  if(cfg.voice) sel.value = cfg.voice;
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function say(text){
  return new Promise(res => {
    if(!cfg.speak || !text){ res(); return; }
    const clean = text.replace(/[*_`#>]/g, "").replace(/https?:\/\/\S+/g, "Link");
    const parts = clean.match(/[^.!?\n]+[.!?]*/g) || [clean];
    let i = 0; speaking = true; setState("speaking", "Aria spricht …");
    const next = () => {
      if(i >= parts.length){ speaking = false; res(); return; }
      const u = new SpeechSynthesisUtterance(parts[i++].trim());
      u.lang = "de-DE"; u.rate = 1.03;
      const v = voices.find(v => v.name === cfg.voice) || voices[0]; if(v) u.voice = v;
      u.onend = next; u.onerror = () => { speaking = false; res(); };
      speechSynthesis.speak(u);
    };
    next();
  });
}

/* ---------- Sprache ein ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false;
function startRec(){
  if(!SR){ add("e", "Dieser Browser kann keine Spracherkennung. Nutze Chrome oder Edge."); return; }
  if(recOn || busy) return;
  rec = new SR(); rec.lang = "de-DE"; rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { recOn = true; setState("listening", cfg.wake && always ? "Sag „Aria …“" : "Ich höre zu …"); };
  rec.onresult = e => {
    let t = "", fin = false;
    for(let i = e.resultIndex; i < e.results.length; i++){ t += e.results[i][0].transcript; if(e.results[i].isFinal) fin = true; }
    if(!fin){ $("#status").textContent = "… " + t; return; }
    onHeard(t);
  };
  rec.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){ always = false; syncMic(); add("e", "Mikrofon-Zugriff verweigert. Bitte in der Adressleiste erlauben (am besten über http://localhost oder https öffnen)."); }
  };
  rec.onend = () => { recOn = false; if(always && !busy && !speaking) setTimeout(startRec, 250); else if(!busy && !speaking) setState("idle", "Tippe auf die Kugel und sprich."); };
  try{ rec.start(); }catch(e){}
}
function stopRec(){ if(rec){ rec.onend = null; try{ rec.abort(); }catch(e){} } recOn = false; }
function onHeard(t){
  if(always && cfg.wake){
    const re = /\b(aria|arja|arya|maria|area)\b[,.!?:]*\s*/i;
    if(re.test(t)) t = t.replace(re, "");
    else if(Date.now() > awakeUntil) return;
    if(!t.trim()){ add("s", "Ja?"); say("Ja?"); awakeUntil = Date.now() + 9000; return; }
  }
  handle(t);
}
function syncMic(){ const m = $("#mic"); m.textContent = "Dauerhören: " + (always ? "an" : "aus"); m.classList.toggle("off", !always); m.setAttribute("aria-pressed", always); }

/* ---------- Events ---------- */
$("#orb").onclick = () => { if(busy){ speechSynthesis.cancel(); return; } recOn ? (stopRec(), setState("idle", "Tippe auf die Kugel und sprich.")) : startRec(); };
$("#mic").onclick = () => { always = !always; syncMic(); if(always){ awakeUntil = 0; startRec(); } else { stopRec(); setState("idle", "Tippe auf die Kugel und sprich."); } };
$("#send").onclick = () => { const v = $("#txt").value; $("#txt").value = ""; handle(v); };
$("#txt").onkeydown = e => { if(e.key === "Enter") $("#send").click(); };
$("#setBtn").onclick = () => { $("#key").value = cfg.key; $("#wake").checked = cfg.wake; $("#speakOn").checked = cfg.speak; loadVoices(); $("#dlg").showModal(); };
$("#saveBtn").onclick = () => {
  cfg.key = $("#key").value.trim(); cfg.voice = $("#voice").value; cfg.wake = $("#wake").checked; cfg.speak = $("#speakOn").checked;
  store.set("aria_key", cfg.key); store.set("aria_voice", cfg.voice); store.set("aria_wake", cfg.wake); store.set("aria_speak", cfg.speak);
  $("#dlg").close();
};
$("#clearBtn").onclick = () => { history = []; $("#log").innerHTML = ""; $("#dlg").close(); };

add("a", cfg.key ? "Aria ist online. Wie kann ich helfen?" : "Hallo, ich bin Aria. Trag zuerst in den Einstellungen deinen Gemini API-Key ein.");
if(!cfg.key) setTimeout(() => $("#setBtn").click(), 400);
</script>
</body>
</html>
