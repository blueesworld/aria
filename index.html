<style>

<script>

/* ---------- Schlüssel (Failover: fällt einer aus, springt der nächste ein) ---------- */

const TG = { token: "9218323898:AAE9KG4HPDnt2o_JaTqTnfx2sNsvuJDf8hM", chat: "9280697806" };

const $ = s => document.querySelector(s), el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const wait = ms => new Promise(r => setTimeout(r, ms));

  s(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let state = "standby", history = [], busy = false, speaking = false, started = false, level = 0, pulse = 0, ki = 0;

/* ---------- Anzeige ---------- */
function setState(s) { state = s; $("#state").textContent = { standby: "STANDBY", listening: "ICH HÖRE", thinking: "VERARBEITE", speaking: "ANTWORTE" }[s]; }
function sub(who, t) { $("#sub small").textContent = who; $("#subt").textContent = t; }

  const l = $("#log"); l.prepend(d); while (l.children.length > 6) l.lastChild.remove();

  const td = ls.g("aria_todos", []), nt = ls.g("aria_notes", []).slice(-2).reverse(), n = td.length;

const renderNotes = renderCards;

/* ---------- Live-Aktionsfenster ---------- */
async function typeInto(node, text, sp) { for (const ch of text) { node.textContent += ch; await wait(sp || 16); } }
function act(icon, title) {
  const w = el("div", "act"); w.innerHTML = '<div class="ah"><span>' + icon + '</span><b></b><i class="sp"></i></div><div class="ab"></div><div class="pg"><i></i></div>';

  return {
    line(t, c) { const d = el("div", "ln " + (c || "")); d.textContent = t; ab.append(d); ab.scrollTop = ab.scrollHeight; return d; },
    link(u, t) { if (!/^https?:\/\//i.test(u || "")) return; const a = el("a", "ln"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = "› " + (t || u); ab.append(a); ab.scrollTop = ab.scrollHeight; },

    add(n) { ab.style.maxHeight = "62vh"; ab.append(n); ab.scrollTop = ab.scrollHeight; },
    done(ok, ms) { w.classList.add(ok === false ? "bad" : "ok"); pg.style.width = "100%"; setTimeout(() => { w.classList.add("out"); setTimeout(() => w.remove(), 700); }, ms || 9000); }

function go(u) { const w = window.open(u, "_blank", "noopener"); if (!w) log("Popup blockiert – bitte Popups erlauben", "er"); return !!w; }

  const a = act(ic, ti), bar = a.line("", "url");
  await typeInto(bar, shown || url.replace(/^https?:\/\//, ""), 14); bar.classList.add("fin");

const RETRY = [401, 403, 429, 500, 502, 503, 504];
async function gpost(path, mk) {
  let err;

    const idx = (ki + t) % KEYS.length;
    try {
      const r = await fetch("https://api.groq.com/openai/v1/" + path, mk(KEYS[idx]));
      if (r.ok) { if (idx !== ki) log("Schlüssel " + (idx + 1) + " übernimmt", "er"); ki = idx; $("#key").textContent = "KEY " + (ki + 1) + "/" + KEYS.length; return r; }
      const d = await r.json().catch(() => ({}));
      const e = new Error(d.error?.message || "HTTP " + r.status); e.status = r.status; e.code = d.error?.code; err = e;
      if (!RETRY.includes(r.status)) throw e;
      if (t >= KEYS.length - 1) await wait(700);
    } catch (e) {
      if (e.name === "AbortError" || (e.status && !RETRY.includes(e.status))) throw e;
      err = e.status ? e : new Error("Netzwerkfehler"); if (!e.status) await wait(500);
    }
  }

}
const jh = k => ({ "Content-Type": "application/json", "Authorization": "Bearer " + k });
async function groq(body) { return (await gpost("chat/completions", k => ({ method: "POST", headers: jh(k), body: JSON.stringify(body) }))).json(); }
async function chat(body) {
  let err;
  for (const m of ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]) {
    try { return await groq({ ...body, model: m }); }
    catch (e) { err = e; if (e.code === "tool_use_failed" || RETRY.includes(e.status) || e.message === "Netzwerkfehler") continue; throw e; }
  }
  throw err;
}
async function ask(text, hint) {
  history.push({ role: "user", content: text + (hint ? " (Spracherkennung unsicher, Alternativen: " + hint + ")" : "") });
  for (let i = 0; i < 8; i++) {
    const d = await chat({ messages: [{ role: "system", content: sys() }, ...history], tools: OT, tool_choice: "auto", temperature: .6, max_completion_tokens: 1500, reasoning_effort: "low" });
    const m = d.choices?.[0]?.message; if (!m) throw new Error("Leere Antwort");
    history.push({ role: "assistant", content: m.content || "", ...(m.tool_calls?.length ? { tool_calls: m.tool_calls } : {}) });
    if (!m.tool_calls?.length) return (m.content || "").trim() || "Erledigt, Boss.";
    for (const tc of m.tool_calls) {
      let args = {}; try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) {}
      log("▸ " + tc.function.name + " " + Object.values(args).join(" ").slice(0, 40), "ok");
      let out = await runTool(tc.function.name, args);
      out = typeof out === "string" ? out : JSON.stringify(out);
      history.push({ role: "tool", tool_call_id: tc.id, content: out.slice(0, 3500) });
    }

}
async function handle(t, hint, tg) {
  t = t.trim(); if (!t) return;

  busy = true; stopRec(); speechSynthesis.cancel(); sub(tg ? "DU (TELEGRAM)" : "DU", t); setState("thinking");
  const mark = history.length;
  try {
    const a = await ask(t, hint); sub("ARIA", a); if (tg) tgSend(a);
    await say(a);
    while (history.length > 40) { history.shift(); while (history.length && history[0].role !== "user") history.shift(); }
  } catch (e) {
    if (history.length > mark) history.length = mark;
    log("Fehler: " + e.message, "er"); sub("FEHLER", e.message);
    await say(/limit|429|quota/i.test(e.message) ? "Beide Schlüssel sind am Limit, Boss. Gib mir einen Moment." : "Ich habe gerade keine Verbindung zum Kern, Boss.");

async function research(q) {
  const x = act("🛰", "LIVE-RECHERCHE"); x.line(q.slice(0, 80), "url").classList.add("fin");
  const th = x.line("", "think"), an = x.line("", "ans");
  const seen = new Set(), seenQ = new Set(), hosts = []; let ans = "";
  const tool = t => {
    if (!t) return; let a = t.arguments; try { if (typeof a === "string") a = JSON.parse(a); } catch (e) { a = {}; }
    const qq = a && (a.query || a.url); if (qq && !seenQ.has(qq)) { seenQ.add(qq); x.line((a.query ? "🔎 Suche: " : "📄 Lese: ") + qq); x.prog(20 + seenQ.size * 12); }
    ((t.search_results && t.search_results.results) || []).forEach(r => { if (!/^https?:/i.test(r.url || "") || seen.has(r.url) || seen.size >= 5) return; seen.add(r.url); try { hosts.push(new URL(r.url).hostname.replace(/^www\./, "")); } catch (e) {} x.link(r.url, r.title); });
  };

  for (const [model, useTool] of [["openai/gpt-oss-120b", 1], ["openai/gpt-oss-20b", 1], ["openai/gpt-oss-20b", 0]]) {
    try {

      const r = await gpost("chat/completions", k => ({ method: "POST", headers: jh(k), body: JSON.stringify(body) }));
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop();
        for (const l of lines) {
          if (!l.startsWith("data:") || l.includes("[DONE]")) continue;
          let j; try { j = JSON.parse(l.slice(5)); } catch (e) { continue; }
          const c = j.choices && j.choices[0], dl = (c && c.delta) || {};
          if (dl.reasoning) th.textContent = (th.textContent + dl.reasoning).slice(-260);
          (dl.executed_tools || (c && c.message && c.message.executed_tools) || []).forEach(tool);

  }

}

  for (let i = 0; i < 64; i++) { const a = i * 6.2832 / 64, k = (state === "standby" ? .02 : .3) * (.4 + .6 * Math.abs(Math.sin(t * 5 + i * 1.7) * Math.cos(t * 2.3 + i * .6))) * (.3 + level * 2.2), r0 = R * .46; g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * (r0 + R * k), Math.sin(a) * (r0 + R * k)); }
  g.stroke();
  const rg = R * (.5 + level * .12), gr = g.createRadialGradient(0, 0, 0, 0, 0, rg);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.12, "#ffb3b3"); gr.addColorStop(.4, col); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.globalAlpha = .75 + level * .25; g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rg, 0, 7); g.fill();
  g.restore(); g.save(); g.strokeStyle = col; g.globalAlpha = .45; g.lineWidth = 2;
  [[10, 10, 1, 1], [W - 10, 10, -1, 1], [10, H - 10, 1, -1], [W - 10, H - 10, -1, -1]].forEach(([x, y, a, b]) => { g.beginPath(); g.moveTo(x, y + b * 38); g.lineTo(x, y); g.lineTo(x + a * 38, y); g.stroke(); });
  g.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
